<style>
:root{--red:#ff1f3d;--hd:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--bd:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{background:#000}
body{min-height:100vh;min-height:100dvh;font:400 16px/1.5 var(--bd);color:#fff;-webkit-font-smoothing:antialiased;
background:#000;
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nf{min-height:100vh;min-height:100dvh;width:min(1280px,100%);margin-inline:auto;padding:clamp(20px,4vw,56px);display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:clamp(16px,4vw,64px)}
.art img{display:block;width:100%;height:auto;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.tx{text-align:center;display:grid;justify-items:center;gap:22px}
h1{font-family:var(--hd);font-weight:800;font-size:clamp(2.5rem,5.6vw,4.9rem);line-height:.98;letter-spacing:-.04em;text-shadow:0 0 .5em rgba(255,255,255,.28)}
h1 em{display:block;font-style:normal;color:var(--red);text-shadow:0 0 .45em rgba(255,31,61,.7)}
.tx p{font-size:clamp(1rem,1.5vw,1.2rem);color:rgba(255,255,255,.88);max-width:34ch}
.acts{display:grid;gap:14px;width:min(340px,100%);margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:99px;font-weight:600;font-size:1rem;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);transition:transform .25s,box-shadow .25s,background .25s}
.btn svg{width:20px;height:20px;flex:none}
.btn.p{border-color:rgba(255,255,255,.25);background:linear-gradient(180deg,#ff3a55,#cf0825);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -10px 18px rgba(110,0,18,.45),0 10px 36px -10px var(--red)}
.btn.o{background:rgba(0,0,0,.35)}
.btn:hover{transform:translateY(-2px)}.btn.p:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -10px 18px rgba(110,0,18,.45),0 14px 44px -8px var(--red)}.btn.o:hover{background:rgba(255,255,255,.1)}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
@media(max-width:820px){.nf{grid-template-columns:1fr;align-content:center;gap:8px;padding-top:28px}.art{max-width:560px;margin-inline:auto}}
@media(prefers-reduced-motion:reduce){.art img{animation:none}.btn{transition:none}}
</style></head><body>
