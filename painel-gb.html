<label class="lb" for="vl">Ou link externo (Drive, Vimeo…)</label><div class="fld"><input id="vl" type="url" placeholder="https://"></div><div class="cn" id="m5" role="status"></div><button class="btn p">Enviar ao cliente</button></form>`
:`<div class="glass pnl"><h2>Em andamento</h2><p class="mute">A equipe está cuidando do seu projeto. O vídeo aparece aqui quando for entregue.</p></div>`}`}
function projects(){
if(pj)return pjView(false);if(nw)return pjForm();
const p=PL[me.plan],mine=PJ.filter(x=>x.user_id==me.id),pend=mine.filter(x=>x.status!='entregue').length,full=p.v-me.used.v-pend<=0;
return`<div class="glass pnl gap"><h2>Meus projetos</h2>${p.v?bar('Vídeos',Math.min(p.v,me.used.v+pend),p.v)+(pend?`<p class="mute" style="font-size:13px">${pend} em andamento · ${Math.max(0,p.v-me.used.v-pend)} disponíveis</p>`:''):''}${p.l?bar('Landing page ou site',me.used.l,p.l):''}<p class="mute">Solicitações em andamento já contam no seu limite.</p>
${p.v?`<button class="btn p" data-a="nw" ${full?'disabled':''}>+ Solicitar projeto</button>${full?'<p class="mute">Você atingiu o limite de vídeos do seu plano.</p>':''}`:''}</div>
${p.v?`<div class="glass pnl"><h2>Solicitações</h2>${pjList(mine,false,'Nenhum projeto ainda. Solicite o primeiro.')}</div>`:''}`}
const pjAdmin=()=>pj?pjView(true):`<div class="glass pnl"><h2>Projetos</h2>${pjList(PJ,true,'Nenhuma solicitação ainda.')}</div>`;
const V={admin:{Dashboard:adminHome,Clientes:clientesV,Suporte:supportV,'Configurações':settingsV},client:{'Visão Geral':clientHome,'Meus Projetos':projects,Suporte:supportV,'Configurações':settingsV}};
V.admin.Projetos=pjAdmin;
function draw(){const A=me.role=='admin',nav=NAV[me.role],open=tickets().filter(t=>t.status!='resolvido'&&(A||t.email==me.email)).length;
$('#nav').innerHTML=nav.map((n,i)=>`<button class="nv ${i==page?'on':''}" data-a="nav" data-i="${i}">${I(n[0])}<span>${n[1]}</span>${n[1]=='Suporte'&&open?`<i class="nb">${open}</i>`:''}</button>`).join('');
const nm=nav[page][1],f=V[me.role][nm];$('#view').innerHTML=f?f():`<div class="glass pnl"><h2>${nm}</h2><p class="mute">Esta seção será conectada ao seu sistema.</p></div>`}
const goSup=()=>{page=NAV[me.role].findIndex(n=>n[1]=='Suporte');tk=null;draw()};
/* EVENTS */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a=='mode'){mode=mode=='login'?'register':'login';auth()}
else if(a=='eye'){const i=b.parentNode.querySelector('input');i.type=i.type=='password'?'text':'password'}
else if(a=='forgot'){const e=$('#ae').value.trim();if(!e)return $('#er').textContent='Digite seu e-mail acima primeiro.';const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});$('#er').style.color=error?'':'#6ee7a0';$('#er').textContent=error?'Não foi possível enviar o e-mail.':'Enviamos um link para redefinir sua senha.'}
else if(a=='nav'){page=+b.dataset.i;tk=null;pj=null;nw=false;draw()}
else if(a=='goSup')goSup()
else if(a=='tk'){tk=+b.dataset.id;draw()}
else if(a=='back'){tk=null;draw()}
else if(a=='res'){const t=tickets().find(x=>x.id==tk);await sb.from('tickets').update({status:t.status=='resolvido'?'aberto':'resolvido'}).eq('id',tk);await refresh();draw()}
else if(a=='u'){const u=clients().find(x=>x.email==b.dataset.e),k=b.dataset.k,q=PL[u.plan][k=='v'?'v':'l'],val=Math.max(0,Math.min(q,u.used[k]+ +b.dataset.n));await sb.from('profiles').update(k=='v'?{used_videos:val}:{used_sites:val}).eq('id',u.id);await refresh();draw()}
else if(a=='nw'){nw=true;draw()}
else if(a=='pjx'){nw=false;draw()}
else if(a=='pjb'){pj=null;draw()}
else if(a=='pj'){pj=+b.dataset.id;SU=['',''];const p=PJ.find(x=>x.id==pj);if(p&&p.video_path){const[x,y]=await Promise.all([sb.storage.from('videos').createSignedUrl(p.video_path,3600),sb.storage.from('videos').createSignedUrl(p.video_path,3600,{download:true})]);SU=[x.data?.signedUrl||'',y.data?.signedUrl||'']}draw()}
else if(a=='ps'){await sb.from('projects').update({status:b.dataset.s}).eq('id',pj);await refresh();draw()}
else if(a=='csv')exportCsv()});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id;
if(id=='af')await submitAuth();
else if(id=='nf'){const{data:t,error}=await sb.from('tickets').insert({subject:$('#ns').value.trim()}).select().single();if(error)return;await sb.from('ticket_messages').insert({ticket_id:t.id,text:$('#nt').value.trim()});await refresh();draw()}
else if(id=='rf'){const{error}=await sb.from('ticket_messages').insert({ticket_id:tk,text:$('#rt').value.trim()});if(!error){await refresh();draw()}}
else if(id=='rq'){const m=$('#m4');say(m,'Enviando…','wait');const{error}=await sb.from('projects').insert({name:$('#qn').value.trim(),kind:$('#qk').value,format:$('#qf').value,deadline:$('#qd').value,brief:$('#qb').value.trim(),link:$('#ql').value.trim()||null});if(error){console.error(error);return say(m,'Não foi possível enviar: '+(error.message||error.code||'erro desconhecido'))}nw=false;await refresh();draw()}
else if(id=='df'){const m=$('#m5'),p=PJ.find(x=>x.id==pj),l=$('#vl').value.trim();let f=$('#vf').files[0];if(!f&&!okUrl(l))return say(m,'Anexe um vídeo ou cole um link válido.');
if(f&&f.size>MAXV){const mb=(f.size/1048576).toFixed(0);if(okUrl(l))f=null;else{$('#vl').focus();return say(m,`Este vídeo tem ${mb} MB e passa do limite de ${MAXV/1048576} MB para envio direto. Suba no Google Drive ou Vimeo e cole o link no campo abaixo.`)}}say(m,'Enviando… não feche esta tela.','wait');let path=null;
if(f){path=`${p.user_id}/${p.id}-${Date.now()}.${(f.name.split('.').pop()||'mp4').replace(/\W/g,'')}`;try{await upVideo(f,path,pc=>say(m,'Enviando vídeo… '+pc+'% (não feche esta tela)','wait'))}catch(e){console.error(e);return say(m,'Falha no upload: '+(e.message||e)+'. Se o arquivo for grande, use o link externo (Drive/Vimeo).')}}
const r2=await sb.from('projects').update({status:'entregue',video_path:path,video_link:f?null:l,delivered_at:new Date().toISOString()}).eq('id',p.id);if(r2.error){console.error(r2.error);return say(m,'Não foi possível concluir a entrega: '+r2.error.message)}
const c=clients().find(x=>x.id==p.user_id);if(c)await sb.from('profiles').update({used_videos:Math.min(PL[c.plan].v,c.used.v+1)}).eq('id',c.id);
pj=null;await refresh();draw()}
else if(id=='sf'){const n=$('#cn').value.trim(),m=$('#m1');if(n.length<2)return say(m,'Digite um nome com pelo menos 2 letras.');say(m,'Salvando…','wait');
const{error}=await sb.rpc('update_my_name',{new_name:n});if(error){console.error(error);return say(m,'Não foi possível salvar o nome.')}
me.name=n;const f=n.split(' ')[0];$('#ini').textContent=f[0].toUpperCase();$('#nm').textContent=f;say(m,'Nome atualizado!','ok')}
else if(id=='pf'){const a=$('#np').value,b=$('#np2').value,m=$('#m2');if(a.length<6)return say(m,'A senha precisa ter pelo menos 6 caracteres.');if(a!=b)return say(m,'As senhas não coincidem.');say(m,'Salvando…','wait');
const{error}=await sb.auth.updateUser({password:a});if(error)return say(m,/different|same/i.test(error.message)?'A nova senha deve ser diferente da atual.':'Não foi possível alterar a senha.');
$('#np').value=$('#np2').value='';say(m,'Senha alterada com sucesso!','ok')}});
$('#out').onclick=logout;$('#lg').src=LOGO;
sb.auth.onAuthStateChange(async(ev)=>{if(ev=='PASSWORD_RECOVERY'){const np=prompt('Digite sua nova senha (mínimo 6 caracteres):');if(np&&np.length>=6){const{error}=await sb.auth.updateUser({password:np});alert(error?'Não foi possível alterar a senha.':'Senha alterada com sucesso!')}}});
sb.auth.getSession().then(({data})=>data.session?start(data.session):auth());
setInterval(async()=>{if(!me||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;await refresh();if(!cfgOpen())draw()},20000);
</script></body></html>
